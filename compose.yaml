# Serves the editor as static files with nginx.
#   docker compose up -d   ->  http://localhost:8080
# The project folder is mounted read-only, so edits show up on a browser refresh.
services:
  editor:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    # Run as the host user so files readable only by you (e.g. under a private
    # home directory) can still be served. Override with UID=... GID=... if needed.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      # ",z" relabels the folder for SELinux (Fedora/RHEL); without it nginx gets 403.
      - ./:/usr/share/nginx/html:ro,z
    restart: unless-stopped
