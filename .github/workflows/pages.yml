# Test, then publish the static site to GitHub Pages.
# Enable it once in the repo: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main, site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the change log is built from the full history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Type-check the JSDoc types (TypeScript is fetched here only; the app has no dependencies).
      - run: npm run typecheck
      # Only what the page needs: no tests, art masters or local tooling.
      - name: Stage the site
        run: |
          mkdir _site
          cp -r index.html styles.css src assets llms.txt sitemap.xml .nojekyll _site/
          node tools/build-changelog.js _site/changelog.json
          find _site -type f | sed 's|^_site/||' | sort > /tmp/files.txt
          echo "$(wc -l < /tmp/files.txt) files, $(du -sb _site | cut -f1) bytes"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ skips dotfiles by default; keep .nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
